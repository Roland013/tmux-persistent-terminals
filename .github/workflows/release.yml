name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout release source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Verify tag and extension identity
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node -e 'const p=require("./package.json"); if (process.env.RELEASE_TAG !== `v${p.version}` || p.name !== "tmux-persistent-terminals" || p.publisher !== "Roland013") process.exit(1)'
      - name: Install tmux for isolated integration tests
        run: sudo apt-get update && sudo apt-get install -y tmux
      - name: Install dependencies
        run: npm ci
      - name: Run compatibility checks
        run: |
          node -e 'require("node-pty"); require("node:child_process").execFileSync("tmux", ["-V"])'
          npm test
          npm run lint
      - name: Package installer and matching source
        run: npm run package:release
      - name: Determine release channel
        id: channel
        run: node -e 'const fs=require("fs"); const p=require("./package.json"); fs.appendFileSync(process.env.GITHUB_OUTPUT, `prerelease=${Number(p.version.split(".")[1]) % 2 === 1}\n`)'
      - name: Create fork GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: tmux Persistent Terminals ${{ github.ref_name }}
          files: |
            dist/*.vsix
            dist/*-source.tar.gz
            dist/SHA256SUMS
          fail_on_unmatched_files: true
          prerelease: ${{ steps.channel.outputs.prerelease }}
          body_path: doc/RELEASE_NOTES.md
